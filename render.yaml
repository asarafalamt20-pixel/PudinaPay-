services:
  - type: web
    name: pudina-pay-demo
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@pudinapay.demo
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/pudina-pay.sqlite
    disk:
      name: pudina-pay-data
      mountPath: /var/data
      sizeGB: 1
